
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: qa
type: Opaque
stringData:
  POSTGRES_DB: ratelimiter
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: devpassword
  DATABASE_URL: postgresql://appuser:devpassword@postgres:5432/ratelimiter
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U appuser -d ratelimiter
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qa
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: qa
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: qa
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: subhrajit29/rate-limiter-python:1.0
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              for f in /app/migrations/*.sql; do
                echo "Applying migration: $f"
                PGPASSWORD="$POSTGRES_PASSWORD" psql \
                  -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                  -v ON_ERROR_STOP=1 -f "$f" || exit 1
              done
          envFrom:
            - secretRef:
                name: app-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rate-limiter
  template:
    metadata:
      labels:
        app: rate-limiter
    spec:
      containers:
        - name: app
          image: subhrajit29/rate-limiter-python:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
  namespace: qa
spec:
  type: NodePort
  selector:
    app: rate-limiter
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
