version: 2.1


jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install lint tools
          command: pip install ruff
      - run:
          name: Run lint
          command: ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies and test tools
          command: |
            pip install -r requirements.txt
            pip install pytest pytest-cov
      - run:
          name: Run unit tests with coverage
          command: |
            python -m pytest tests/test_buckets.py tests/test_bucketss.py \
              --cov=app.buckets \
              --cov-report=term-missing \
              --cov-fail-under=70

  integration-tests:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: postgresql://appuser:devpassword@127.0.0.1:5432/ratelimiter
          REDIS_URL: redis://127.0.0.1:6379/0

      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ratelimiter

      - image: cimg/redis:7.2

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt
            pip install pytest httpx
            sudo apt-get update
            sudo apt-get install -y postgresql-client

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -U appuser -d ratelimiter; then
                echo "PostgreSQL is ready"
                exit 0
              fi
              sleep 2
            done
            echo "PostgreSQL did not become ready"
            exit 1

      - run:
          name: Apply database migrations
          command: |
            for f in migrations/*.sql; do
              echo "Applying migration: $f"
              PGPASSWORD=devpassword psql \
                -h 127.0.0.1 \
                -U appuser \
                -d ratelimiter \
                -v ON_ERROR_STOP=1 \
                -f "$f" || exit 1
            done

      - run:
          name: Wait for Redis
          command: |
            python - <<'PY'
            import time
            import redis

            client = redis.Redis.from_url(
                "redis://127.0.0.1:6379/0",
                socket_connect_timeout=2,
            )

            for attempt in range(30):
                try:
                    if client.ping():
                        print("Redis is ready")
                        break
                except redis.RedisError:
                    time.sleep(2)
            else:
                raise SystemExit("Redis did not become ready")
            PY

      - run:
          name: Run integration tests
          command: python -m pytest tests/test_integration.py -v

workflows:
  build-and-test:
    jobs:
      - lint

      - unit-tests:
          requires:
            - lint

      - integration-tests:
          requires:
            - lint

